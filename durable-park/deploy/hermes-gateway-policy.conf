# Drop-in for the hermes user unit hermes-gateway: check the tool policy before every start, and stop the
# gateway when the durable-park plugin did not load.
# Installed by deploy/configure_hermes.sh as ~hermes/.config/systemd/user/hermes-gateway.service.d/50-durable-park-policy.conf
# (the script paths below are rewritten to this repo's location when it is installed).
# ExecStartPre has a leading "-": a non-zero exit never stops the gateway; the script exits 0 anyway and the
# durable-park plugin refuses every tool call when the report it writes says the policy failed.
# ExecStartPost has NO leading "-": deploy/plugin_load_check.sh exits 1 when no plugin_load.json for the gateway's
# MainPID appears (the plugin failed to import, overran plugins.load_timeout_seconds, or is disabled: Hermes then
# runs with no pre_tool_call hook), and that failure stops the unit. The unit has Restart=always, so the start
# limit below makes a gateway whose plugin cannot load stop after 3 starts in 10 minutes instead of looping
# (3 ordinary crashes, manual restarts or Hermes graceful restarts (exit 75) in 10 minutes count too and end in
# start-limit-hit: after the fix run "systemctl --user reset-failed hermes-gateway && systemctl --user start
# hermes-gateway").
# The first ExecStartPre removes the previous start's load proof, so a proof left by an earlier process with a
# reused pid can never satisfy the check.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=3

[Service]
# The start checks run one policy check per profile (about 4 seconds each) before the gateway starts, then the
# load-proof wait (up to 30 seconds) after it: systemd's default 90 seconds is too short from about ten profiles.
TimeoutStartSec=300
Environment=DURABLE_PARK_POLICY_STATUS=%h/.hermes/plugin-data/durable-park/tool_policy_status.json
Environment=DURABLE_PARK_PLUGIN_LOAD=%h/.hermes/plugin-data/durable-park/plugin_load.json
ExecStartPre=-/bin/rm -f -- %h/.hermes/plugin-data/durable-park/plugin_load.json
ExecStartPre=-/bin/bash %h/durable-park/deploy/tool_policy_check.sh
ExecStartPost=/bin/bash %h/durable-park/deploy/plugin_load_check.sh
