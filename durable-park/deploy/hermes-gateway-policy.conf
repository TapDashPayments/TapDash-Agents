# Drop-in for the hermes user unit hermes-gateway: check the tool policy before every start.
# Installed by deploy/configure_hermes.sh as ~hermes/.config/systemd/user/hermes-gateway.service.d/50-durable-park-policy.conf
# (the path below is rewritten to this repo's location when it is installed).
# The leading "-" on ExecStartPre means a non-zero exit never stops the gateway; the script exits 0 anyway
# and the durable-park plugin refuses every tool call when the report it writes says the policy failed.
[Service]
Environment=DURABLE_PARK_POLICY_STATUS=%h/.hermes/plugin-data/durable-park/tool_policy_status.json
ExecStartPre=-/bin/bash %h/durable-park/deploy/tool_policy_check.sh
