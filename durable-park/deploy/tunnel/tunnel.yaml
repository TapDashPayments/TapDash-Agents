# withHuman tunnel config, mounted read-only at /etc/withhuman/tunnel.yaml.
# The server keys (`quickbooks`, `maverick`, `acceptblue`, `authnet`) are the names entered in withHuman when
# registering each gateway server "Through a tunnel". ${VAR} values come from the
# tunnel's environment (/etc/durable-park/tunnel.env, maverick.env, acceptblue.env and authnet.env
# via docker compose); the tunnel refuses to start if one is unset, so a missing
# env file stops the whole tunnel instead of running only some of the servers.
# Each command server only sees its own env.
# Authorize.net: AUTHNET_ENV is fixed to sandbox (production is a reviewed change to this file, not a typed value);
# the server's own default addresses for the sandbox are used, and its optional webhook receiver is not run.
servers:
  quickbooks:
    command: ["qbo-mcp-server"]
    env:
      QUICKBOOKS_CLIENT_ID: ${QUICKBOOKS_CLIENT_ID}
      QUICKBOOKS_CLIENT_SECRET: ${QUICKBOOKS_CLIENT_SECRET}
      QUICKBOOKS_REFRESH_TOKEN: ${QUICKBOOKS_REFRESH_TOKEN}
      QUICKBOOKS_REALM_ID: ${QUICKBOOKS_REALM_ID}
      QUICKBOOKS_ENVIRONMENT: sandbox
      # Rotated refresh tokens are persisted here (named volume). Once this file
      # exists its values override the env above (stale-token trap: see docs).
      QUICKBOOKS_TOKEN_STORE_PATH: /data/qbo-token.env
  maverick:
    command: ["maverick-mcp-server"]
    env:
      MAVERICK_TOKEN: ${MAVERICK_TOKEN}
      MAVERICK_GATEWAY_URL: ${MAVERICK_GATEWAY_URL}
      MAVERICK_DASHBOARD_URL: ${MAVERICK_DASHBOARD_URL}
      MAVERICK_INBOX_DIR: /data/maverick-inbox
  acceptblue:
    command: ["acceptblue-mcp-server"]
    env:
      ACCEPTBLUE_SOURCE_KEY: ${ACCEPTBLUE_SOURCE_KEY}
      ACCEPTBLUE_PIN: ${ACCEPTBLUE_PIN}
      ACCEPTBLUE_BASE_URL: ${ACCEPTBLUE_BASE_URL}
  authnet:
    command: ["authnet-mcp-server"]
    env:
      AUTHNET_ENV: sandbox
      AUTHNET_LOGIN_ID: ${AUTHNET_LOGIN_ID}
      AUTHNET_TRANSACTION_KEY: ${AUTHNET_TRANSACTION_KEY}
